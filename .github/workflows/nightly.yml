name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC every day
  workflow_dispatch:

permissions:
  contents: read

# Action versions are pinned to commit SHAs, as in go.yml; the tag is in the trailing comment and
# in docs/decisions/versions.md.
jobs:
  # The Raft fault suite (04.08) at full strength: every scenario 5 times in a row, including the
  # container-level ones against the Compose raft-1..3 (docker kill, pause, network disconnect).
  fault-raft:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # above go test -timeout=90m, so a hang dumps goroutines and the report uploads
    env:
      FF_TEST_REQUIRE_DOCKER: "1"
      FF_FAULT_CONTAINERS: "1"
      FF_FAULT_ARTIFACTS: ${{ github.workspace }}/fault-artifacts # Porcupine histories of any violation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make raft-up # builds flowforge-raft:dev and starts raft-1..3
      - run: make test-fault-raft FAULT_RUNS=5
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raft-fault-report
          path: |
            docs/testing/raft-fault-report.md
            docs/testing/raft-fault-results.json
            bin/raft-fault-results.jsonl
            fault-artifacts
          if-no-files-found: ignore
