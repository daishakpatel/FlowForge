# Code generation for `make proto` (task 03.01). Local plugins pinned in the Makefile
# (PROTOC_GEN_GO_VERSION, PROTOC_GEN_GO_GRPC_VERSION), so generation needs no network.
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen/proto
    opt: paths=source_relative
