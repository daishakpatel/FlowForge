# Local development stack (task 01.02). Credentials are dev-only constants (00C §10.4).
# Profiles: core = postgres; streaming = timescaledb (Kafka joins in 05.01); ai = postgres for aiops;
# raft, ui and obs are reserved for later tasks; full = everything. Map: docs/development.md.
# Image tags are pinned; keep them in step with internal/testutil and docs/decisions/versions.md.
name: flowforge

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    profiles: [core, ai, full]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${FF_DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the image's temporary init server listens on the socket only,
      # so this passes only once init scripts have finished and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d flowforge"]
      interval: 2s
      timeout: 3s
      retries: 30

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg16
    profiles: [streaming, full]
    environment:
      POSTGRES_USER: md
      POSTGRES_PASSWORD: md
      POSTGRES_DB: marketdata
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:${FF_DEV_MD_PORT:-5433}:5432"
    volumes:
      - mddata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U md -d marketdata"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 3-node Raft KV (task 04.06): static peers on the internal network. The client port 7000 is
  # published on the host as 7001-7003; the peer port 7100 is never published. The admin token is
  # a dev-only default (FF_RAFT_ADMIN_TOKEN). Map: docs/architecture/raft-operations.md.
  raft-1: &raft
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.raft
    image: flowforge-raft:dev
    profiles: [raft, full]
    environment: &raft-env
      FF_RAFT_NODE_ID: "1"
      FF_RAFT_PEERS: 1=raft-1:7100,2=raft-2:7100,3=raft-3:7100
      FF_RAFT_DATA_DIR: /data
      FF_RAFT_CLIENT_ADDR: ":7000"
      FF_RAFT_PEER_ADDR: ":7100"
      FF_RAFT_HTTP_ADDR: ":8083"
      FF_RAFT_SNAPSHOT_ENTRIES: ${FF_RAFT_SNAPSHOT_ENTRIES:-10000}
      FF_RAFT_SNAPSHOT_TRAILING: ${FF_RAFT_SNAPSHOT_TRAILING:-1000}
      FF_RAFT_ADMIN_TOKEN: ${FF_RAFT_ADMIN_TOKEN:-dev-only-raft-admin-token}
      FF_LOG_FORMAT: text
    ports:
      - "127.0.0.1:7001:7000"
    volumes:
      - raft1data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/flowforge-raft", "health", "--addr", "127.0.0.1:7000"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  raft-2:
    <<: *raft
    environment:
      <<: *raft-env
      FF_RAFT_NODE_ID: "2"
    ports:
      - "127.0.0.1:7002:7000"
    volumes:
      - raft2data:/data

  raft-3:
    <<: *raft
    environment:
      <<: *raft-env
      FF_RAFT_NODE_ID: "3"
    ports:
      - "127.0.0.1:7003:7000"
    volumes:
      - raft3data:/data

volumes:
  pgdata:
  mddata:
  raft1data:
  raft2data:
  raft3data:
