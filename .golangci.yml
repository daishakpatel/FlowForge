# golangci-lint v2 config (version pinned in docs/decisions/versions.md and .github/workflows/go.yml).
# Boundary rules come from task 01.01 §5 and 00C §8; `make lint-selftest` proves they fire.
version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/daishakpatel/flowforge

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - noctx
    - revive
  settings:
    gosec:
      severity: medium
      confidence: medium
    forbidigo:
      analyze-types: true
      forbid:
        # 01.04: wall-clock reads and timers go through internal/clock; cmd/** and internal/clock are exempt (see exclusions).
        - pattern: ^time\.(Now|Since|Until|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$
          msg: read time and wait through an injected clock.Clock (internal/clock), see 00C §8.1
        # 01.03: config comes only from internal/config; cmd/** and internal/testutil are exempt (see exclusions).
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read configuration through internal/config (docs/configuration.md), see 00C §8.1
    depguard:
      rules:
        pure-domain:
          files:
            - "**/internal/dag/**"
            - "**/internal/workflow/model/**"
            - "**/internal/workflow/statemachine/**"
            - "**/internal/workflow/template/**"
          deny:
            - pkg: database/sql
              desc: domain logic is database-free (ADR-020)
            - pkg: github.com/jackc/pgx
              desc: domain logic is database-free (ADR-020)
            - pkg: net/http
              desc: domain logic has no transport
            - pkg: google.golang.org/grpc
              desc: domain logic has no transport
            - pkg: github.com/daishakpatel/flowforge/internal/persistence
              desc: domain must not depend on persistence (00C §8)
            - pkg: github.com/daishakpatel/flowforge/internal/api
              desc: domain must not depend on the API layer (00C §8)
        raft-fsm:
          files:
            - "**/internal/raftkv/fsm/**"
          deny:
            - pkg: net
              desc: the Raft FSM is deterministic, no network (ADR-005)
            - pkg: github.com/daishakpatel/flowforge/internal/persistence
              desc: Raft holds coordination state only (ADR-003)
        raftkv:
          files:
            - "**/internal/raftkv/**"
          deny:
            - pkg: github.com/daishakpatel/flowforge/internal/persistence
              desc: Raft holds coordination state only (ADR-003)
            - pkg: github.com/daishakpatel/flowforge/internal/scheduler
              desc: raftkv imports no FlowForge application packages (00C §8.1)
        stream-domain:
          files:
            - "**/internal/stream/domain/**"
          deny:
            - pkg: database/sql
              desc: the stream domain is pure (00C §8.1)
            - pkg: github.com/jackc/pgx
              desc: the stream domain is pure (00C §8.1)
            - pkg: github.com/twmb/franz-go
              desc: the stream domain is pure (00C §8.1)
        api:
          files:
            - "**/internal/api/**"
          deny:
            - pkg: github.com/daishakpatel/flowforge/internal/scheduler
              desc: the API never schedules (master spec §3.2)
  exclusions:
    rules:
      - path: (^|/)cmd/
        linters:
          - forbidigo
      # internal/clock wraps the time package; only the time rule is lifted, the env ban still applies.
      - path: (^|/)internal/clock/
        text: time\.
        linters:
          - forbidigo
      # internal/testutil reads FF_TEST_* (00A amendment, 01.02); only the env rule is lifted.
      - path: (^|/)internal/(config|testutil)/
        text: os\.(Getenv|LookupEnv|Environ)
        linters:
          - forbidigo
